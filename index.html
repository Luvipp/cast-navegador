<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<title>Cast Navegador — Media Center</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#131722;--panel2:#1a2030;--text:#f6f7fb;--muted:#9ba6bb;--line:#2a3346;--accent:#83f2c2;--accent2:#8fa8ff;--bad:#ff8e9b;--gold:#f6cf7a;--radius:22px}*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 80% -10%,#23334d 0,transparent 40%),radial-gradient(ellipse at 0 35%,#162b2c 0,transparent 35%),var(--bg)}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:13px 16px;font-weight:750;color:#07130f;background:var(--accent);transition:transform .15s,opacity .15s}button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#252d3d;color:var(--text);border:1px solid #39445a}button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}button.small{padding:9px 11px;font-size:13px;border-radius:11px}.hidden{display:none!important}.shell{width:min(1120px,100%);margin:auto;padding:22px 20px 42px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#7ebcff);color:#08131b;font-size:24px;font-weight:950;box-shadow:0 8px 28px #83f2c222}.brand h1{font-size:20px;letter-spacing:-.04em;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:var(--muted);font-size:12px;white-space:nowrap}.dot{height:8px;width:8px;background:#707a8c;border-radius:50%;display:inline-block}.dot.good{background:var(--accent);box-shadow:0 0 12px #83f2c288}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:850;color:var(--accent)}h2,h3,p{margin-top:0}h2{font-size:clamp(28px,5vw,46px);letter-spacing:-.055em;line-height:1.04;margin-bottom:12px}h3{font-size:17px;letter-spacing:-.02em;margin-bottom:8px}.muted{color:var(--muted)}.hero{position:relative;overflow:hidden;border:1px solid #3a4960;border-radius:30px;background:linear-gradient(110deg,#1b2637ee,#111622e8 55%,#153b38dd),radial-gradient(circle at 78% 28%,#83f2c244,transparent 30%);padding:clamp(24px,5vw,48px);min-height:270px;display:flex;align-items:center;justify-content:space-between;gap:24px;box-shadow:0 24px 70px #0003}.hero:after{content:"▶";position:absolute;right:5%;top:0;font-size:clamp(170px,30vw,330px);line-height:1;color:#ffffff08;font-weight:950;pointer-events:none}.hero-copy{position:relative;z-index:1;max-width:650px}.hero-copy .eyebrow{margin-bottom:14px}.hero-copy p{max-width:540px;color:#c1cada;margin-bottom:20px}.hero-side{position:relative;z-index:1;min-width:180px;text-align:center;border:1px solid #ffffff20;background:#05091255;backdrop-filter:blur(10px);padding:20px;border-radius:24px}.big-code{font-size:clamp(28px,4vw,40px);letter-spacing:.15em;font-weight:900;margin:8px 0}.panel{background:linear-gradient(145deg,#171c29f5,#10141df5);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 16px 45px #0002}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.section-head h3{margin:0}.statusline{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.video-frame{background:#020307;border:1px solid #283144;border-radius:18px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center;position:relative}video{width:100%;height:100%;max-height:58vh;background:#000;object-fit:contain}.video-empty{padding:25px;text-align:center;max-width:360px}.video-empty .playmark{width:58px;height:58px;display:grid;place-items:center;border-radius:20px;background:#83f2c21a;border:1px solid #83f2c244;color:var(--accent);font-size:23px;margin:0 auto 14px}.error{color:var(--bad);font-size:13px;min-height:18px;margin:10px 0 0}.note{font-size:12px;color:var(--muted);line-height:1.55}.input{width:100%;border:1px solid #374258;background:#0b0f18;color:var(--text);border-radius:14px;padding:14px 15px;outline:none;min-width:0}.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #83f2c214}label{display:block;font-size:13px;font-weight:700;color:#d8deeb;margin:0 0 8px}.field{margin-bottom:12px}.formrow{display:flex;gap:9px}.formrow .input{flex:1}.quicklinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{border:1px solid #344057;background:#1b2332;color:#dfe6f5;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:700}.chip:hover{border-color:var(--accent)}.control-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.control-grid button{font-size:17px;padding:14px 8px}.range{width:100%;accent-color:var(--accent)}.time-row{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.volume-row{display:flex;align-items:center;gap:10px;margin-top:14px}.volume-row .range{flex:1}.tabs{display:flex;gap:7px;padding:5px;background:#0b0f17;border:1px solid var(--line);border-radius:15px;margin-bottom:17px}.tab{flex:1;background:transparent;color:var(--muted);padding:10px 8px;font-size:12px}.tab.active{background:#242d3d;color:var(--text);box-shadow:inset 0 0 0 1px #39445a}.media-list{display:grid;gap:8px}.media-item{display:flex;align-items:center;gap:11px;padding:10px;border:1px solid #293247;background:#0e131d;border-radius:15px;min-width:0}.media-thumb{width:48px;height:48px;flex-shrink:0;border-radius:12px;background:linear-gradient(145deg,#224b49,#29314b 55%,#684565);display:grid;place-items:center;font-size:19px}.media-meta{min-width:0;flex:1}.media-meta strong{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.media-meta span{display:block;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item-actions{display:flex;gap:6px}.empty-list{padding:18px 8px;color:var(--muted);text-align:center;font-size:13px;border:1px dashed #30394d;border-radius:14px}.remote-head{margin-bottom:18px}.remote-head h2{font-size:clamp(27px,6vw,38px)}.remote-layout{display:grid;grid-template-columns:1fr .85fr;gap:16px}.footer{text-align:center;color:#727e92;font-size:11px;margin-top:24px}.screen-shell{max-width:1300px;padding:24px}.screen-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.screen-brand{display:flex;gap:12px;align-items:center}.screen-brand h1{margin:0;font-size:22px}.screen-brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.screen-hero{padding:clamp(22px,4vw,42px);min-height:220px}.screen-hero h2{font-size:clamp(30px,5vw,56px)}.screen-hero .big-code{font-size:clamp(34px,4vw,52px)}.screen-layout{display:grid;grid-template-columns:1.4fr .6fr;gap:16px;margin-top:16px}.screen-video-panel{padding:18px}.screen-video-panel .video-frame{border-radius:16px}.screen-info{display:flex;flex-direction:column;gap:14px}.now-card{display:flex;flex-direction:column;justify-content:center;min-height:150px}.now-title{font-size:20px;font-weight:850;overflow-wrap:anywhere;margin:6px 0}.now-url{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.screen-help{margin-top:auto}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:800}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:10;background:#e7fff4;color:#0c2019;border-radius:13px;padding:11px 15px;font-size:13px;font-weight:800;box-shadow:0 12px 35px #0005;max-width:calc(100vw - 28px)}
@media(max-width:760px){.shell{padding:16px 13px 32px}.topbar{margin-bottom:18px}.badge.top-badge{font-size:0;padding:10px}.badge.top-badge .dot{margin:0}.hero{display:block;border-radius:24px;min-height:0;padding:24px}.hero-side{margin-top:20px;max-width:280px}.grid,.remote-layout,.screen-layout{grid-template-columns:1fr}.screen-shell{padding:14px}.screen-top{align-items:flex-start}.screen-brand h1{font-size:18px}.screen-hero{display:block}.screen-hero .hero-side{max-width:none}.panel{padding:16px}.formrow{flex-direction:column}.formrow button{width:100%}.section-head{align-items:flex-start}.screen-video-panel{padding:12px}.screen-video-panel video{max-height:45vh}}
@media(min-width:761px){.remote-shell{padding-top:28px}.remote-hero{min-height:200px}.remote-hero .hero-side{min-width:150px}.remote-layout .panel{height:fit-content}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const mode = qs.get('mode') === 'screen' ? 'screen' : 'remote';
const STORAGE = {favorites:'cast2-favorites',history:'cast2-history'};
let ws = null, joined = false, roomCode = '', currentMedia = null, currentTab = 'recent', toastTimer = null;
const sample = 'https://www.w3schools.com/html/mov_bbb.mp4';
function read(key){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}
function write(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch{}}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const el=$('toast');if(!el)return;el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2400)}
function getTitle(url){try{const u=new URL(url);let name=decodeURIComponent(u.pathname.split('/').filter(Boolean).pop()||u.hostname);name=name.replace(/\.(mp4|m4v|webm|ogv|mov|m3u8)(\?.*)?$/i,'').replace(/[._-]+/g,' ').trim();return name||u.hostname}catch{return url}}
function hostOf(url){try{return new URL(url).hostname}catch{return url}}
function saveHistory(item){let arr=read(STORAGE.history).filter(x=>x.url!==item.url);arr.unshift({...item,at:Date.now()});write(STORAGE.history,arr.slice(0,30))}
function isFav(url){return read(STORAGE.favorites).some(x=>x.url===url)}
function toggleFav(item){let arr=read(STORAGE.favorites);if(arr.some(x=>x.url===item.url)){arr=arr.filter(x=>x.url!==item.url);toast('Removido dos favoritos')}else{arr.unshift(item);toast('Adicionado aos favoritos')}write(STORAGE.favorites,arr);renderMediaList()}
function send(obj){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(obj));else toast('Sem conexão com o servidor. Recarregue a página.')}
function fmt(s){if(!Number.isFinite(Number(s))||s<0)return '0:00';s=Math.floor(Number(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function socketConnect(){const protocol=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(`${protocol}//${location.host}`);ws.onopen=()=>{if(mode==='screen')send({type:'register-screen'})};ws.onclose=()=>{if(mode==='screen'){setScreenStatus('Servidor desconectado',false)}else if(!joined){const el=$('remoteStatus');if(el)el.textContent='Não foi possível conectar ao servidor. Atualize a página.'}};ws.onerror=()=>{if(mode==='screen')setScreenStatus('Falha na conexão',false)};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='registered'&&mode==='screen'){roomCode=m.code;$('roomCode').textContent=roomCode;setScreenStatus('Pronto para conectar',true)}if(m.type==='peer'){if(mode==='screen'){setScreenStatus(m.connected?'Celular conectado':'Aguardando celular',m.connected)}else if(joined){$('remoteStatus').textContent=m.connected?'Conectado à TV':'Conexão com a TV perdida.';$('connectionBadge').innerHTML=`<span class="dot ${m.connected?'good':''}"></span>${m.connected?'Conectado':'Desconectado'}`}}if(m.type==='joined'&&mode==='remote'){joined=true;$('remoteStatus').textContent='Conectado! Escolha um vídeo abaixo.';$('remoteControls').classList.remove('hidden');$('joinBtn').disabled=true;$('joinCode').disabled=true;$('connectionBadge').innerHTML='<span class="dot good"></span>Conectado';toast('Conectado ao PS4')};if(m.type==='error'&&mode==='remote')$('remoteStatus').textContent=m.message;if(mode==='screen')handleScreen(m);if(mode==='remote'&&m.type==='progress'){const seek=$('seek');if(seek&&!seek.matches(':active')&&m.duration>0){seek.max=m.duration;seek.value=m.currentTime||0}$('currentTime').textContent=fmt(m.currentTime);$('duration').textContent=fmt(m.duration)}}}
function setScreenStatus(text,good){const el=$('screenStatus');if(el)el.textContent=text;const dot=$('screenDot');if(dot)dot.classList.toggle('good',!!good)}
function renderRemote(){
$('app').innerHTML=`<main class="shell remote-shell"><header class="topbar"><div class="brand"><div class="logo">▶</div><div><h1>Cast <span style="color:var(--accent)">Navegador</span></h1><p>Seu media center pessoal</p></div></div><div id="connectionBadge" class="badge top-badge"><span class="dot"></span>Não conectado</div></header>
<section class="hero remote-hero"><div class="hero-copy"><div class="eyebrow">Media center · versão 2.0</div><h2>Sua próxima sessão começa aqui.</h2><p>Escolha um vídeo no celular, envie para a TV e controle a reprodução sem sair do sofá.</p></div><div class="hero-side"><div class="kicker">Conectar à TV</div><div style="font-size:13px;color:var(--muted);margin:7px 0 12px">Digite o código que aparece no PS4</div><div class="formrow"><input id="joinCode" class="input" type="text" inputmode="numeric" maxlength="6" placeholder="000000" aria-label="Código da TV"><button id="joinBtn">Conectar</button></div><p id="remoteStatus" class="error" style="margin-bottom:0"></p></div></section>
<div id="remoteControls" class="hidden" style="margin-top:18px"><div class="remote-layout"><section class="panel"><div class="section-head"><div><div class="eyebrow">Sua biblioteca</div><h3 style="margin-top:5px">Escolha o que assistir</h3></div><span class="badge">Local no celular</span></div><div class="field"><label for="videoUrl">Link do vídeo ou da página</label><input id="videoUrl" class="input" type="url" placeholder="https://exemplo.com/video.mp4" autocomplete="url"></div><div class="formrow"><button id="loadBtn" style="flex:1">▶ Enviar para a TV</button><button id="testBtn" class="secondary">Testar MP4</button></div><div id="linkDiagnosis" class="note" style="margin-top:10px">Dica: links diretos MP4 são os mais compatíveis. Páginas de streaming podem não expor uma fonte reproduzível.</div><div class="quicklinks"><button class="chip" id="sampleBtn">Usar link de teste</button><button class="chip" id="pasteBtn">Colar da área de transferência</button></div><p id="sendError" class="error"></p><div style="height:1px;background:var(--line);margin:18px 0"></div><div class="section-head"><h3>Controle remoto</h3><span class="statusline"><span class="dot good"></span>Ao vivo</span></div><div class="control-grid"><button class="secondary" id="backBtn">−10s</button><button id="playBtn">▶ / Ⅱ</button><button class="secondary" id="forwardBtn">+10s</button></div><div style="margin-top:17px"><label for="seek">Posição do vídeo</label><input id="seek" class="range" type="range" min="0" max="100" value="0"><div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div></div><div class="volume-row"><span aria-hidden="true">🔈</span><input id="volume" class="range" type="range" min="0" max="1" step="0.05" value="0.8"><span aria-hidden="true">🔊</span></div><p class="note" style="margin:12px 0 0">Os controles funcionam com vídeos compatíveis enviados por este painel.</p></section>
<section class="panel"><div class="section-head"><div><div class="eyebrow">Coleção</div><h3 style="margin-top:5px">Seus vídeos</h3></div><button id="clearHistory" class="ghost small">Limpar histórico</button></div><div class="tabs"><button class="tab active" data-tab="recent">Recentes</button><button class="tab" data-tab="favorites">Favoritos</button></div><div id="mediaList" class="media-list"></div><div style="height:16px"></div><div class="section-head"><h3>Como funciona</h3></div><p class="note">O celular envia a URL ao PS4. O navegador do console precisa conseguir acessar e reproduzir o vídeo. Links de páginas, conteúdo com DRM ou login não são garantidos. Favoritos e histórico ficam salvos apenas neste celular.</p></section></div></div><footer class="footer">Cast Navegador · Feito para a tela grande, controlado pelo celular.</footer></main>`;
$('joinBtn').addEventListener('click',()=>{const code=$('joinCode').value.replace(/\D/g,'');if(code.length!==6){$('remoteStatus').textContent='Digite os seis números que aparecem na TV.';return}$('remoteStatus').textContent='Conectando…';send({type:'join',code})});$('joinCode').addEventListener('input',()=>{$('joinCode').value=$('joinCode').value.replace(/\D/g,'').slice(0,6)});
$('loadBtn').addEventListener('click',()=>submitUrl($('videoUrl').value));$('testBtn').addEventListener('click',()=>{ $('videoUrl').value=sample;submitUrl(sample)});$('sampleBtn').addEventListener('click',()=>{$('videoUrl').value=sample;$('linkDiagnosis').textContent='MP4 público de teste selecionado. Toque em “Enviar para a TV”.'});$('pasteBtn').addEventListener('click',async()=>{try{const t=await navigator.clipboard.readText();if(t){$('videoUrl').value=t;diagnose(t);toast('Link colado')}}catch{$('sendError').textContent='Seu navegador não permitiu acessar a área de transferência. Toque no campo e cole manualmente.'}});$('videoUrl').addEventListener('input',()=>diagnose($('videoUrl').value));
$('backBtn').addEventListener('click',()=>send({type:'seek',delta:-10}));$('forwardBtn').addEventListener('click',()=>send({type:'seek',delta:10}));$('playBtn').addEventListener('click',()=>send({type:'toggle'}));$('seek').addEventListener('change',()=>send({type:'seek',time:Number($('seek').value)}));$('volume').addEventListener('input',()=>send({type:'volume',value:Number($('volume').value)}));$('clearHistory').addEventListener('click',()=>{write(STORAGE.history,[]);renderMediaList();toast('Histórico limpo')});document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{currentTab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));renderMediaList()}));renderMediaList();}
function diagnose(raw){const el=$('linkDiagnosis');if(!el)return;try{const u=new URL(raw);if(!['http:','https:'].includes(u.protocol)){el.textContent='Use um endereço que comece com http:// ou https://';return}if(/\.(mp4|m4v|webm|ogv|mov)(\?|$)/i.test(u.pathname+u.search)){el.textContent='Parece um link direto de vídeo. É o tipo mais compatível com o PS4.'}else if(/\.m3u8(\?|$)/i.test(u.pathname+u.search)){el.textContent='Parece uma playlist HLS (.m3u8). A compatibilidade depende do navegador e do servidor.'}else{el.textContent='Este endereço parece ser uma página, não um arquivo de vídeo direto. O player pode não conseguir reproduzi-lo sem suporte específico.'}}catch{el.textContent='Cole um endereço completo para analisar o tipo de link.'}}
function submitUrl(raw){const err=$('sendError');err.textContent='';try{const u=new URL(String(raw||'').trim());if(!['http:','https:'].includes(u.protocol))throw new Error('Use um link HTTP ou HTTPS válido.');const item={url:u.href,title:getTitle(u.href)};send({type:'load',url:item.url,title:item.title});currentMedia=item;saveHistory(item);renderMediaList();$('remoteStatus').textContent='Link enviado. A TV está tentando abrir o vídeo.';toast('Enviado para a TV');diagnose(item.url)}catch(e){err.textContent=e.message||'Digite um endereço completo e válido.'}}
function renderMediaList(){const box=$('mediaList');if(!box)return;const list=currentTab==='favorites'?read(STORAGE.favorites):read(STORAGE.history);if(!list.length){box.innerHTML=`<div class="empty-list">${currentTab==='favorites'?'Seus favoritos aparecerão aqui. Toque na estrela de um vídeo.':'Seus vídeos recentes aparecerão aqui depois que você enviar um link.'}</div>`;return}box.innerHTML=list.map(item=>`<div class="media-item"><div class="media-thumb">▶</div><div class="media-meta"><strong>${escapeHtml(item.title||getTitle(item.url))}</strong><span>${escapeHtml(hostOf(item.url))}</span></div><div class="item-actions"><button class="ghost small" data-play="${encodeURIComponent(item.url)}" aria-label="Reproduzir">▶</button><button class="ghost small" data-fav="${encodeURIComponent(item.url)}" aria-label="Favorito">${isFav(item.url)?'★':'☆'}</button></div></div>`).join('');box.querySelectorAll('[data-play]').forEach(b=>b.addEventListener('click',()=>{const url=decodeURIComponent(b.dataset.play);$('videoUrl').value=url;submitUrl(url)}));box.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click',()=>{const url=decodeURIComponent(b.dataset.fav);toggleFav({url,title:getTitle(url)})}))}
function renderScreen(){$('app').innerHTML=`<main class="shell screen-shell"><header class="screen-top"><div class="screen-brand"><div class="logo">▶</div><div><h1>Cast Navegador</h1><p>Media center pessoal</p></div></div><div class="badge"><span id="screenDot" class="dot"></span><span id="screenStatus">Conectando ao servidor…</span></div></header><section class="hero screen-hero"><div class="hero-copy"><div class="eyebrow">Sua tela está pronta</div><h2>Uma tela grande.<br>Seu controle na mão.</h2><p>Abra o controle no celular, digite o código ao lado e envie um vídeo compatível para começar.</p></div><div class="hero-side"><div class="kicker">Código de pareamento</div><div id="roomCode" class="big-code">------</div><div class="note">Digite este código no celular</div></div></section><div class="screen-layout"><section class="panel screen-video-panel"><div class="section-head"><div><div class="eyebrow">Reprodução</div><h3 id="nowTitle" style="margin-top:5px">Pronto para assistir</h3></div><span class="badge"><span class="dot good"></span>Receptor</span></div><div class="video-frame"><video id="video" playsinline controls class="hidden"></video><div id="videoEmpty" class="video-empty"><div class="playmark">▶</div><h3>Aguardando seu próximo vídeo</h3><p class="muted" style="margin-bottom:0">Quando você enviar um link pelo celular, ele aparecerá aqui.</p></div></div><p id="screenError" class="error"></p></section><aside class="screen-info"><section class="panel now-card"><div class="eyebrow">Tocando agora</div><div id="nowTitleSide" class="now-title">Nada por enquanto</div><div id="nowUrl" class="now-url">Conecte o celular para enviar um vídeo.</div></section><section class="panel screen-help"><div class="eyebrow">Dica rápida</div><h3 style="margin-top:7px">Melhor compatibilidade</h3><p class="note" style="margin-bottom:0">Use primeiro links diretos de MP4 públicos. Páginas de streaming, links que exigem login e vídeos protegidos podem não funcionar no navegador do PS4.</p></section></aside></div><footer class="footer">Cast Navegador 2.0 · Conecte o celular para controlar a reprodução.</footer></main>`;const v=$('video');v.classList.add('hidden');v.addEventListener('timeupdate',()=>{const now=Date.now();if(!v._lastSent||now-v._lastSent>700){v._lastSent=now;send({type:'progress',currentTime:v.currentTime||0,duration:Number.isFinite(v.duration)?v.duration:0})}});v.addEventListener('error',()=>{if(v.currentSrc)$('screenError').textContent='Não foi possível reproduzir este vídeo. Teste um MP4 público compatível.'});v.addEventListener('loadedmetadata',()=>{if(currentMedia){$('nowTitle').textContent=currentMedia.title;$('nowTitleSide').textContent=currentMedia.title;$('nowUrl').textContent=hostOf(currentMedia.url)}})}
function handleScreen(m){const v=$('video');if(m.type==='load'){try{const u=new URL(m.url);if(!['http:','https:'].includes(u.protocol))throw new Error('Use um link HTTP ou HTTPS.');currentMedia={url:u.href,title:m.title||getTitle(u.href)};$('screenError').textContent='';$('videoEmpty').classList.add('hidden');v.classList.remove('hidden');$('nowTitle').textContent=currentMedia.title;$('nowTitleSide').textContent=currentMedia.title;$('nowUrl').textContent=hostOf(u.href);v.src=u.href;v.load();const p=v.play();if(p&&p.catch)p.catch(()=>{$('screenError').textContent='O vídeo carregou, mas a reprodução automática foi bloqueada. Aperte ▶ no player da TV.'})}catch(e){$('screenError').textContent=e.message||'Link inválido.'}}else if(m.type==='play')v.play().catch(()=>{});else if(m.type==='pause')v.pause();else if(m.type==='toggle'){if(v.paused)v.play().catch(()=>{});else v.pause()}else if(m.type==='seek'){if(Number.isFinite(v.duration)){const target=Number.isFinite(m.delta)?v.currentTime+m.delta:m.time;v.currentTime=Math.max(0,Math.min(v.duration,Number(target)||0))}}else if(m.type==='volume')v.volume=Math.max(0,Math.min(1,Number(m.value)||0));else if(m.type==='mute')v.muted=!!m.value}
if(mode==='screen'){renderScreen()}else{renderRemote()}socketConnect();
})();
</script>
